name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSBuild bereitstellen
        uses: microsoft/setup-msbuild@v2

      - name: EXE und MSI bauen
        shell: pwsh
        run: .\installer\build-msi.ps1 -Platform ${{ matrix.platform }}

      - name: MSI als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: MultiSnip-${{ matrix.platform }}
          path: dist/*.msi
          if-no-files-found: error
